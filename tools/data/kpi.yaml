# KPIs da implantação — mede resultado, não só esforço.
indicadores:
  - kpi: "Prazo (on-time)"
    categoria: "Projeto"
    meta: "Virada na data prevista (± 5%)"
    medicao: "Data real da virada vs. prevista"
  - kpi: "Orçamento (on-budget)"
    categoria: "Projeto"
    meta: "Horas reais ≤ horas contratadas + bonificadas"
    medicao: "Horas reais / horas planejadas"
  - kpi: "% usuários treinados"
    categoria: "Adoção"
    meta: "100% antes da virada"
    medicao: "Treinados / total de usuários"
  - kpi: "% UAT aprovado"
    categoria: "Qualidade"
    meta: ">= 95%"
    medicao: "Casos aprovados / total UAT"
  - kpi: "Defeitos críticos na virada"
    categoria: "Qualidade"
    meta: "0"
    medicao: "Contagem de severidade Crítica em aberto"
  - kpi: "Adoção de uso (1ª semana)"
    categoria: "Adoção"
    meta: ">= 80%"
    medicao: "Usuários ativos / esperados"
  - kpi: "Time-to-value"
    categoria: "Valor"
    meta: "1º fechamento no 1º mês"
    medicao: "Dias da virada até o 1º fechamento"
  - kpi: "Chamados no hypercare (tendência)"
    categoria: "Estabilização"
    meta: "Queda semana a semana"
    medicao: "Chamados/semana"
  - kpi: "CSAT do cliente"
    categoria: "Satisfação"
    meta: ">= 4 de 5"
    medicao: "Pesquisa no encerramento"

# Marcos do projeto (para o painel de prazo)
marcos:
  - "Levantamento liberado"
  - "Projeto + Cronograma"
  - "Conversão prévia"
  - "Conversão oficial"
  - "Virada oficial"
  - "Encerramento"

# Horas por macro-etapa (planejado vs. real)
horas:
  - etapa: "Parametrização"
  - etapa: "Treinamento"
  - etapa: "Simulações/Testes"
  - etapa: "Acompanhamento/Hypercare"
