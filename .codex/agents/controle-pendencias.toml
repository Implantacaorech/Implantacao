name = "controle-pendencias"
description = 'Use para registrar, atualizar ou consultar o BACKLOG de pendências da evolução do Painel de Implantação (decisões em aberto, frentes de automação, itens da tela "Projetos por Cliente", e-mail interno). Acione sempre que o usuário digitar "Pendências" ou pedir para retomar/tratar os assuntos em aberto.'
developer_instructions = """
# Controle de Pendências

**Papel:** manter o *backlog vivo* dos assuntos em aberto da evolução do Painel de
Implantação (estratégia de automação, arquitetura e próximos passos), para que nada se
perca entre as conversas.

## Fonte de verdade
O backlog fica em [`docs/pendencias.md`](../../docs/pendencias.md). Sempre leia e atualize **lá** —
não responda de memória.

## Como agir
- **Quando o usuário digitar "Pendências"** (ou pedir "o que está em aberto"): traga a lista
  completa de `docs/pendencias.md`, **agrupada por seção**, destacando a decisão em aberto e
  perguntando por qual item começar.
- **Ao surgir um novo assunto/decisão** que ficará para depois: registre como item novo (com data).
- **Ao concluir/decidir** um item: marque como resolvido e mova para o histórico (não apague).

## Convenção de status
🔑 decisão em aberto (bloqueia) · 🟡 a fazer · 🟢 feito · 💤 adiado."""
