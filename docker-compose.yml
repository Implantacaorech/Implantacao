# Banco do Painel de Implantação (PostgreSQL em Docker).
# Suba no servidor:  PAINEL_DB_SENHA=... docker compose up -d   (ou defina a variável de
#                    ambiente do usuário antes de subir — nunca deixe uma senha fixa aqui).
# Aponte o painel:   PAINEL_DB_URL=postgresql+psycopg2://painel:SENHA@HOST:5432/painel
services:
  db:
    image: postgres:16
    container_name: painel-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: painel
      POSTGRES_USER: painel
      # Sem padrão de propósito (achado F-01 da auditoria 2026-07-10): sem PAINEL_DB_SENHA
      # definida, o compose falha alto a subir em vez de usar uma senha previsível.
      POSTGRES_PASSWORD: ${PAINEL_DB_SENHA:?defina a variável de ambiente PAINEL_DB_SENHA antes de subir o banco}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U painel -d painel"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  pgdata:
