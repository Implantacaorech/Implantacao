<div class="cabecalho">
  <h1>{{ usuarioId() ? 'Editar usuário' : 'Novo usuário' }}</h1>
  <a routerLink="/usuarios" class="voltar">← Voltar</a>
</div>

<form class="form-usuario" [formGroup]="form" (ngSubmit)="salvar()">
  <label>
    Nome
    <input type="text" formControlName="nome" />
  </label>

  <label>
    E-mail *
    <input type="email" formControlName="email" />
  </label>

  <label>
    Login
    <input type="text" formControlName="login" placeholder="(em branco usa o e-mail)" />
  </label>

  <label>
    Código SICLA *
    <input type="text" formControlName="codigoSicla" />
  </label>

  <label>
    Hierarquia
    <select formControlName="perfil">
      @for (perfil of perfis; track perfil) {
        <option [value]="perfil">{{ perfil }}</option>
      }
    </select>
  </label>

  <label>
    Senha
    <input type="password" formControlName="senha" placeholder="(em branco mantém a atual)" />
  </label>

  <label class="checkbox">
    <input type="checkbox" formControlName="ativo" />
    Ativo
  </label>

  @if (erro()) {
    <p class="erro col-2">{{ erro() }}</p>
  }

  <div class="acoes col-2">
    <button type="submit" [disabled]="form.invalid || salvando()">
      {{ salvando() ? 'Salvando…' : 'Salvar' }}
    </button>
  </div>
</form>
