<h1 class="pagina-titulo"><svg class="svgi svgi-xl ic-brand" aria-hidden="true"><use href="#ic-tools"/></svg> Assistente de Geradores (legado)</h1>
<p class="sub">Ferramenta interna de suporte/QA para os geradores Office originais — teste modelos,
  converta tempo verbal e rode o verificador de saúde. Distinta do fluxo de implantação do cliente.</p>

<div class="grade">
  @for (r of roles; track r.id) {
    <a class="card" [routerLink]="['/legado', r.id]">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:6px">
        <span class="icone">{{ r.icone }}</span>
        <h3 class="m0">{{ r.nome }}</h3>
      </div>
      <p>{{ r.desc }}</p>
    </a>
  }
</div>
