<div class="tela-cadastro">
  <div class="cartao-cadastro">
    <h1>Painel de Implantação</h1>

    @if (etapa() === 'dados') {
      <p class="subtitulo">Crie seu acesso</p>
      <form [formGroup]="formDados" (ngSubmit)="enviarDados()">
        <label>
          Nome
          <input type="text" formControlName="nome" autocomplete="name" />
        </label>

        <label>
          E-mail
          <input type="email" formControlName="email" autocomplete="email" />
        </label>

        <label>
          Senha
          <input type="password" formControlName="senha" autocomplete="new-password" />
        </label>

        <label>
          Código SICLA
          <input type="text" formControlName="codigoSicla" />
        </label>

        @if (erro()) {
          <p class="erro">{{ erro() }}</p>
        }

        <button type="submit" [disabled]="formDados.invalid || enviando()">
          {{ enviando() ? 'Enviando…' : 'Continuar' }}
        </button>
      </form>
    } @else {
      <p class="subtitulo">Digite o código enviado para {{ formDados.getRawValue().email }}</p>
      <form [formGroup]="formCodigo" (ngSubmit)="confirmarCodigo()">
        <label>
          Código de verificação
          <input type="text" formControlName="codigo" maxlength="6" inputmode="numeric" autocomplete="one-time-code" />
        </label>

        @if (erro()) {
          <p class="erro">{{ erro() }}</p>
        }
        @if (aviso()) {
          <p class="aviso">{{ aviso() }}</p>
        }

        <button type="submit" [disabled]="formCodigo.invalid || enviando()">
          {{ enviando() ? 'Confirmando…' : 'Confirmar' }}
        </button>

        <div class="acoes-secundarias">
          <button type="button" class="link" (click)="voltarParaDados()">← Corrigir dados</button>
          <button type="button" class="link" [disabled]="reenviando()" (click)="reenviarCodigo()">
            {{ reenviando() ? 'Reenviando…' : 'Reenviar código' }}
          </button>
        </div>
      </form>
    }

    <a routerLink="/login" class="voltar-login">Já tem acesso? Entrar</a>
  </div>
</div>
