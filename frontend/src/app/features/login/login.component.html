<div class="acesso-cartao">
  <img class="acesso-logo" src="logo-portal-rech-azul.png" alt="Portal Rech" />
  @if (subtitulo()) {
    <h1 class="pagina-titulo acesso-sub">{{ subtitulo() }}</h1>
  }

  <form [formGroup]="form" (ngSubmit)="enviar()">
    @if (motivo()) {
      <div class="resultado">{{ motivo() }}</div>
    }
    @if (erro()) {
      <div class="resultado erro">⚠️ {{ erro() }}</div>
    }

    <label class="acesso-campo">
      <input type="email" formControlName="login" autocomplete="username"
             placeholder=" " autofocus />
      <span>E-mail<i>*</i></span>
    </label>

    <label class="acesso-campo">
      <input type="password" formControlName="senha" autocomplete="current-password"
             placeholder=" " />
      <span>Senha</span>
    </label>

    <div class="acesso-linha">
      <label class="acesso-check">
        <input type="checkbox" formControlName="lembrar" />
        <span>Lembrar-me</span>
      </label>
      <a routerLink="/esqueci-senha">Esqueci minha senha</a>
    </div>

    <button class="acesso-botao" type="submit" [disabled]="form.invalid || enviando()">
      {{ enviando() ? 'Entrando…' : 'Entrar' }}
    </button>
  </form>
</div>
