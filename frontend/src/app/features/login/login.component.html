<div style="max-width:380px;margin:9vh auto;padding:0 20px">
  <div style="text-align:center;margin-bottom:8px">
    <img src="logo-rech-color.png" alt="Rech Sistemas de Gestão" style="height:64px;width:auto;object-fit:contain" />
  </div>
  <h1 class="pagina-titulo centro">Painel de Implantação</h1>
  <form class="painel" [formGroup]="form" (ngSubmit)="enviar()">
    @if (erro()) {
      <div class="resultado erro">⚠️ {{ erro() }}</div>
    }
    <label class="campo">
      <span>Login (e-mail)</span>
      <input formControlName="login" autocomplete="username" />
    </label>
    <label class="campo">
      <span>Senha</span>
      <input type="password" formControlName="senha" autocomplete="current-password" />
    </label>
    <button class="btn primario bloco" type="submit" [disabled]="form.invalid || enviando()">
      {{ enviando() ? 'Entrando…' : 'Entrar' }}
    </button>
  </form>
  <p class="dica" style="text-align:center">Não tem acesso? <a routerLink="/cadastro">Criar conta</a></p>
  <p class="dica" style="text-align:center;margin-top:2px">Rech Sistemas de Gestão</p>
</div>
