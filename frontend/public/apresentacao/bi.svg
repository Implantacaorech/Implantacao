<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="Área de BI com indicadores de contratação, conclusão, utilização de horas e alocação de agendas">
  <style>
    .t{font-family:Inter,'Segoe UI',system-ui,sans-serif}
    .h{font-size:9px;font-weight:700;fill:#003399}
    .s{font-size:7.5px;fill:#5A6B82}
    .kpi{font-size:19px;font-weight:700}
  </style>
  <rect width="640" height="400" rx="10" fill="#fff"/>
  <rect x=".5" y=".5" width="639" height="399" rx="10" fill="none" stroke="#E2E8F0"/>
  <path d="M0 10a10 10 0 0 1 10-10h620a10 10 0 0 1 10 10v24H0z" fill="#001F66"/>
  <text class="t" x="18" y="21" style="font-size:10px;font-weight:600;fill:#fff">BI Implantação</text>

  <!-- abas -->
  <g class="t" style="font-size:8.5px">
    <rect x="16" y="44" width="104" height="20" rx="6" fill="#E8EEF8"/>
    <text x="68" y="58" fill="#003399" font-weight="600" text-anchor="middle">Contratação</text>
    <text x="146" y="58" fill="#5A6B82">Conclusão</text>
    <text x="216" y="58" fill="#5A6B82">% Utilização</text>
    <text x="300" y="58" fill="#5A6B82">Alocação</text>
    <text x="368" y="58" fill="#5A6B82">Movimentos</text>
    <rect x="452" y="44" width="172" height="20" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="538" y="58" fill="#5A6B82" text-anchor="middle">BI Clientes SIGER (4 abas)</text>
  </g>

  <!-- KPIs -->
  <g>
    <rect x="16" y="74" width="146" height="56" rx="8" fill="#fff" stroke="#E2E8F0"/>
    <text class="t s" x="28" y="92">Horas contratadas · 2026</text>
    <text class="t kpi" x="28" y="116" style="fill:#003399">4.860</text>
    <rect x="170" y="74" width="146" height="56" rx="8" fill="#fff" stroke="#E2E8F0"/>
    <text class="t s" x="182" y="92">Horas aplicadas</text>
    <text class="t kpi" x="182" y="116" style="fill:#0891B2">3.712</text>
    <rect x="324" y="74" width="146" height="56" rx="8" fill="#fff" stroke="#E2E8F0"/>
    <text class="t s" x="336" y="92">% de utilização</text>
    <text class="t kpi" x="336" y="116" style="fill:#15803D">76,4%</text>
    <rect x="478" y="74" width="146" height="56" rx="8" fill="#fff" stroke="#E2E8F0"/>
    <text class="t s" x="490" y="92">Implantações concluídas</text>
    <text class="t kpi" x="490" y="116" style="fill:#7C3AED">27</text>
  </g>

  <!-- barras -->
  <rect x="16" y="142" width="300" height="130" rx="8" fill="#fff" stroke="#E2E8F0"/>
  <text class="t h" x="30" y="160">Contratação por mês (horas)</text>
  <g fill="#003399">
    <rect x="34" y="216" width="18" height="36" rx="3"/>
    <rect x="62" y="204" width="18" height="48" rx="3"/>
    <rect x="90" y="190" width="18" height="62" rx="3"/>
    <rect x="118" y="210" width="18" height="42" rx="3"/>
    <rect x="146" y="182" width="18" height="70" rx="3"/>
    <rect x="174" y="196" width="18" height="56" rx="3"/>
    <rect x="202" y="176" width="18" height="76" rx="3"/>
    <rect x="230" y="188" width="18" height="64" rx="3"/>
    <rect x="258" y="200" width="18" height="52" rx="3" fill="#02C3F8"/>
  </g>
  <line x1="30" y1="252" x2="302" y2="252" stroke="#E2E8F0"/>
  <g class="t s" text-anchor="middle" style="fill:#94A3B8">
    <text x="43" y="264">jan</text><text x="71" y="264">fev</text><text x="99" y="264">mar</text><text x="127" y="264">abr</text>
    <text x="155" y="264">mai</text><text x="183" y="264">jun</text><text x="211" y="264">jul</text><text x="239" y="264">ago</text><text x="267" y="264">set</text>
  </g>

  <!-- rosca -->
  <rect x="324" y="142" width="300" height="130" rx="8" fill="#fff" stroke="#E2E8F0"/>
  <text class="t h" x="338" y="160">Situação da carteira</text>
  <g transform="translate(400,212)">
    <circle r="38" fill="none" stroke="#15803D" stroke-width="16" stroke-dasharray="130 109" transform="rotate(-90)"/>
    <circle r="38" fill="none" stroke="#B45309" stroke-width="16" stroke-dasharray="48 191" transform="rotate(105)"/>
    <circle r="38" fill="none" stroke="#B42318" stroke-width="16" stroke-dasharray="26 213" transform="rotate(177)"/>
    <circle r="38" fill="none" stroke="#CBD5E1" stroke-width="16" stroke-dasharray="35 204" transform="rotate(216)"/>
    <text class="t" y="-2" text-anchor="middle" style="font-size:14px;font-weight:700;fill:#0F1B2D">63</text>
    <text class="t s" y="12" text-anchor="middle">projetos</text>
  </g>
  <g class="t s">
    <rect x="470" y="176" width="9" height="9" rx="3" fill="#15803D"/><text x="486" y="184">No prazo · 34</text>
    <rect x="470" y="196" width="9" height="9" rx="3" fill="#B45309"/><text x="486" y="204">Em risco · 13</text>
    <rect x="470" y="216" width="9" height="9" rx="3" fill="#B42318"/><text x="486" y="224">Atrasados · 7</text>
    <rect x="470" y="236" width="9" height="9" rx="3" fill="#CBD5E1"/><text x="486" y="244">Pausados · 9</text>
  </g>

  <!-- linha do tempo / alocação -->
  <rect x="16" y="284" width="608" height="100" rx="8" fill="#fff" stroke="#E2E8F0"/>
  <text class="t h" x="30" y="302">Alocação de agendas · horas aplicadas por consultor</text>
  <g>
    <text class="t s" x="30" y="322">Ana Prado</text>
    <rect x="120" y="314" width="440" height="9" rx="4.5" fill="#F1F5F9"/>
    <rect x="120" y="314" width="352" height="9" rx="4.5" fill="#003399"/>
    <text class="t s" x="572" y="322">88%</text>
    <text class="t s" x="30" y="344">Carlos Nunes</text>
    <rect x="120" y="336" width="440" height="9" rx="4.5" fill="#F1F5F9"/>
    <rect x="120" y="336" width="277" height="9" rx="4.5" fill="#2563EB"/>
    <text class="t s" x="572" y="344">63%</text>
    <text class="t s" x="30" y="366">Marina Alves</text>
    <rect x="120" y="358" width="440" height="9" rx="4.5" fill="#F1F5F9"/>
    <rect x="120" y="358" width="418" height="9" rx="4.5" fill="#B42318"/>
    <text class="t s" x="572" y="366">95%</text>
  </g>
</svg>
