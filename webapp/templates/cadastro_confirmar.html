<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Confirmar e-mail · Painel de Implantação</title>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div style="max-width:420px;margin:8vh auto;padding:0 20px">
    <div style="text-align:center;margin-bottom:8px">
      <span style="display:inline-flex;width:44px;height:44px;border-radius:12px;background:var(--brand);color:#fff;align-items:center;justify-content:center;font-weight:700;font-size:1.35rem">R</span>
    </div>
    <h1 style="text-align:center;margin:.1em 0">Confirmar e-mail</h1>
    <p class="sub" style="text-align:center">Enviamos um código de 6 dígitos para <strong>{{ email }}</strong>. Informe-o abaixo para concluir.</p>
    <form method="post" class="painel" style="margin-bottom:10px">
      {% if erro %}<div class="resultado erro" style="padding:8px 14px">⚠️ {{ erro }}</div>{% endif %}
      {% if aviso %}<div class="resultado ok" style="padding:8px 14px">✅ {{ aviso }}</div>{% endif %}
      <label class="campo"><span>Código de validação</span>
        <input name="codigo" inputmode="numeric" pattern="[0-9]*" maxlength="6" required autofocus
               style="letter-spacing:.35em;text-align:center;font-size:1.3rem;font-weight:600"></label>
      <button class="btn primario" type="submit" style="width:100%">Validar e entrar</button>
    </form>
    <form method="post" style="margin:0">
      <input type="hidden" name="reenviar" value="1">
      <button class="btn" type="submit" style="width:100%">Reenviar código</button>
    </form>
    <p class="dica" style="text-align:center;margin-top:12px"><a href="{{ url_for('cadastro') }}">← Recomeçar o cadastro</a></p>
  </div>
</body>
</html>
