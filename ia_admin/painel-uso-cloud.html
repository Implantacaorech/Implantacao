<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel de Uso da IA / Cloud — Implantação Rech</title>
<style>
  :root{ --bg:#f5f7fb; --card:#fff; --line:#e3e8f0; --navy:#1f2d50; --brand:#2f5bd0;
         --muted:#6b7385; --ok:#1f9d57; --warn:#c47d12; --err:#c0392b; }
  *{box-sizing:border-box}
  body{margin:0;font:15px/1.5 system-ui,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:#1d2433}
  header{background:var(--navy);color:#fff;padding:16px 22px}
  header h1{margin:0;font-size:1.15rem}
  header p{margin:4px 0 0;color:#c8d2ea;font-size:.85rem}
  main{max-width:1100px;margin:0 auto;padding:20px}
  .status{font-size:.82rem;margin-bottom:14px;padding:8px 12px;border-radius:8px;border:1px solid var(--line)}
  .status.ok{background:#e9f6ef;border-color:#bfe4cd;color:#176c3e}
  .status.warn{background:#fff7e6;border-color:#f0d999;color:#7a5a12}
  .cards{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:18px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;flex:1;min-width:150px}
  .card .n{font-size:1.6rem;font-weight:700;color:var(--brand)}
  .card .l{font-size:.78rem;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
  table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;font-size:.86rem}
  th{background:#eef2fb;color:var(--navy);text-align:left;padding:8px 10px;font-size:.74rem;letter-spacing:.02em;text-transform:uppercase}
  td{border-top:1px solid var(--line);padding:8px 10px;vertical-align:top}
  .pill{display:inline-block;border-radius:10px;padding:1px 8px;font-size:.72rem;font-weight:600}
  .r-baixo{background:#e6f6ec;color:var(--ok)} .r-medio{background:#fdf0db;color:var(--warn)} .r-alto{background:#fbe6e3;color:var(--err)}
  .muted{color:var(--muted)} footer{max-width:1100px;margin:0 auto;padding:0 20px 28px;color:var(--muted);font-size:.78rem}
  code{background:#eef2fb;border-radius:4px;padding:1px 5px}
</style>
</head>
<body>
<header>
  <h1>Painel de Uso da IA / Cloud — Implantação Rech</h1>
  <p>Acompanhamento estático de sessões da IA · separado do painel operacional</p>
</header>
<main>
  <div class="status" id="status"></div>
  <div class="cards" id="cards"></div>
  <table>
    <thead><tr>
      <th>Data</th><th>Objetivo</th><th>Modelo</th><th>Ferramentas</th>
      <th>Alterados</th><th>Risco</th><th>Handoff</th><th>Resp.</th>
    </tr></thead>
    <tbody id="linhas"></tbody>
  </table>
</main>
<footer>Fonte de verdade: <code>uso-cloud.yaml</code> → gere <code>dados.js</code> com
  <code>python ia_admin/gerar_painel.py</code>. Não depende de internet.</footer>

<!-- dados.js é GERADO a partir de uso-cloud.yaml (window.IA_DADOS). -->
<script src="dados.js"></script>
<script>
// Fallback embutido: usado só se dados.js não existir (nunca deixa a tela em branco).
const FALLBACK = { atualizado_em: "(fallback — rode gerar_painel.py)", sessoes: [
  { data:"2026-06-19", objetivo:"(dados de exemplo — gere dados.js a partir do YAML)",
    modelo:"Claude Opus 4.8", ferramentas:["—"], arquivos_alterados:["—"],
    risco_contexto:"medio", handoff:false, responsavel:"—" } ] };

const D = (window.IA_DADOS && Array.isArray(window.IA_DADOS.sessoes)) ? window.IA_DADOS : FALLBACK;
const S = D.sessoes || [];
const viaYaml = !!(window.IA_DADOS && Array.isArray(window.IA_DADOS.sessoes));

const st = document.getElementById("status");
if (viaYaml) {
  st.className = "status ok";
  st.innerHTML = "Dados carregados de <code>uso-cloud.yaml</code> · atualizado em <b>" +
    (D.atualizado_em || "?") + "</b> · " + S.length + " sessão(ões).";
} else {
  st.className = "status warn";
  st.innerHTML = "Não encontrei <code>dados.js</code> (exibindo exemplo). Edite <code>uso-cloud.yaml</code> e rode " +
    "<code>python ia_admin/gerar_painel.py</code> para atualizar a tela.";
}

const arr = v => Array.isArray(v) ? v : (v == null ? [] : [v]);
const cards = [
  { l:"Sessões", n: S.length },
  { l:"Risco alto", n: S.filter(d=>d.risco_contexto==="alto").length },
  { l:"Com handoff", n: S.filter(d=>d.handoff).length },
  { l:"Modelos distintos", n: new Set(S.map(d=>d.modelo)).size }
];
document.getElementById("cards").innerHTML = cards.map(c=>
  `<div class="card"><div class="n">${c.n}</div><div class="l">${c.l}</div></div>`).join("");

const esc = s => String(s==null?"":s).replace(/[&<>]/g, m=>({ "&":"&amp;","<":"&lt;",">":"&gt;" }[m]));
document.getElementById("linhas").innerHTML = S.map(d=>`
  <tr>
    <td>${esc(d.data)}</td>
    <td>${esc(d.objetivo)}</td>
    <td>${esc(d.modelo)}</td>
    <td class="muted">${arr(d.ferramentas).map(esc).join(", ")}</td>
    <td class="muted">${arr(d.arquivos_alterados).map(esc).join(", ")}</td>
    <td><span class="pill r-${esc(d.risco_contexto)||'medio'}">${esc(d.risco_contexto)||"—"}</span></td>
    <td>${d.handoff ? "sim" : "—"}</td>
    <td>${esc(d.responsavel)}</td>
  </tr>`).join("");
</script>
</body>
</html>
