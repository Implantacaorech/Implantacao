name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tools-smoke:
    # webapp/ (Flask) foi retirado de produção em 2026-07-19 e arquivado em projeto_old/
    # (ver vault/18 - Histórico/). tools/ continua vivo: é usado pela ponte
    # webapp/legado_cli.py, chamada em subprocesso pelo backend novo (LegadoCliService).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependências
        run: pip install -r tools/requirements.txt
      - name: Checagem de sintaxe
        run: python -m compileall -q webapp tools
      - name: Smoke dos geradores (best-effort; templates são locais)
        run: cd tools && python verificar.py
        continue-on-error: true

  backend-test:
    # Stack em produção (NestJS/TypeORM + MariaDB) desde 2026-07-19.
    runs-on: ubuntu-latest
    # O runner roda em UTC; o Painel é usado no Brasil. `hojeIso()` devolve o dia LOCAL de
    # proposito (senao dizia "hoje = amanha" para quem trabalha das 21h a meia-noite), e a
    # prova dessa regra so faz sentido num fuso conhecido — em UTC o defeito nao aparece e o
    # teste da virada noturna quebrava todo push. O fuso e definido AQUI, na partida do
    # processo: mudar `process.env.TZ` em tempo de execucao nao vale no Windows, onde o time
    # desenvolve, entao setup de teste nao resolveria para todo mundo.
    env:
      TZ: America/Sao_Paulo
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Instalar dependências
        run: npm ci
      # Com --coverage porque o `coverageThreshold` do package.json só é avaliado quando a
      # cobertura é COLETADA. Sem isso o gate existiria no arquivo e nunca rodaria. É a
      # mesma execução de testes, não uma segunda passada.
      - name: Testes (Jest) + gate de cobertura
        run: npm test -- --ci --coverage
      # Ponta a ponta: sobe o AppModule inteiro com SQLite em memoria e exercita guards,
      # banco e servico via HTTP. Passa a rodar aqui porque, fora do CI, ninguem lembrava de
      # chamar `npm run test:e2e` — o arquivo de passos ficou uma revisao de processo atras
      # e 13 casos falhavam ha dias sem ninguem ver (corrigido em 2026-07-29).
      - name: Testes de ponta a ponta (e2e)
        run: npm run test:e2e -- --ci
      # Passa a BLOQUEAR: a divida de ~1200 achados pre-existentes foi zerada. Enquanto o
      # passo era best-effort, achado novo se perdia no meio dos velhos e ninguem lia.
      - name: Lint
        run: npx eslint "{src,apps,libs,test}/**/*.ts" --max-warnings 10

  docservice-conformidade:
    # Só a guarda de arquitetura (ADR-0002). A suíte completa do docservice depende de
    # modelo de transcrição e de templates .docx locais — não roda no runner. Estes testes
    # leem o CÓDIGO (AST + regex), sem importar o app, então rodam em qualquer lugar.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docservice
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar o pytest
        run: pip install pytest
      - name: Conformidade com o Guia Mestre
        run: python -X utf8 -m pytest tests/test_conformidade_arquitetura.py -v

  frontend-test:
    # Stack novo (Angular) — Vitest via @angular/build:unit-test, roda em Node sem browser real.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependências
        run: npm ci
      - name: Testes (Vitest)
        run: npm test
