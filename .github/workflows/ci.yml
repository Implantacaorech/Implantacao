name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependências
        run: pip install -r tools/requirements.txt pytest
      - name: Checagem de sintaxe
        run: python -m compileall -q webapp tools
      - name: Testes do painel (pytest)
        run: pytest webapp/test_painel.py -q
      - name: Smoke dos geradores (best-effort; templates são locais)
        run: cd tools && python verificar.py
        continue-on-error: true
