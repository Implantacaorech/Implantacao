name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tools-smoke:
    # webapp/ (Flask) foi retirado de produção em 2026-07-19 e arquivado em projeto_old/
    # (ver vault/18 - Histórico/). tools/ continua vivo: é usado pela ponte
    # webapp/legado_cli.py, chamada em subprocesso pelo backend novo (LegadoCliService).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependências
        run: pip install -r tools/requirements.txt
      - name: Checagem de sintaxe
        run: python -m compileall -q webapp tools
      - name: Smoke dos geradores (best-effort; templates são locais)
        run: cd tools && python verificar.py
        continue-on-error: true

  backend-test:
    # Stack em produção (NestJS/TypeORM + MariaDB) desde 2026-07-19.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Instalar dependências
        run: npm ci
      - name: Testes (Jest)
        run: npm test -- --ci
      # Passa a BLOQUEAR: a divida de ~1200 achados pre-existentes foi zerada. Enquanto o
      # passo era best-effort, achado novo se perdia no meio dos velhos e ninguem lia.
      - name: Lint
        run: npx eslint "{src,apps,libs,test}/**/*.ts" --max-warnings 10

  frontend-test:
    # Stack novo (Angular) — Vitest via @angular/build:unit-test, roda em Node sem browser real.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependências
        run: npm ci
      - name: Testes (Vitest)
        run: npm test
