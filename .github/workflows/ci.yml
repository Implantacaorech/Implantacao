name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependências
        run: pip install -r tools/requirements.txt pytest pytest-cov
      - name: Checagem de sintaxe
        run: python -m compileall -q webapp tools
      - name: Smoke do app (rotas registradas)
        run: python webapp/verificar_app.py
      - name: Testes do painel (pytest, com cobertura)
        run: pytest webapp/test_painel.py -q --cov=webapp --cov-report=term-missing
      - name: Smoke dos geradores (best-effort; templates são locais)
        run: cd tools && python verificar.py
        continue-on-error: true

  test-postgres:
    # Paridade dev/prod (achado F-08): confere o schema contra um Postgres real, não só
    # contra o SQLite que a suíte principal usa por isolamento de teste.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: painel
          POSTGRES_USER: painel
          POSTGRES_PASSWORD: postgres_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U painel -d painel"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependências
        run: pip install -r tools/requirements.txt
      - name: Smoke do schema contra Postgres real
        env:
          PAINEL_DB_URL: postgresql+psycopg2://painel:postgres_ci@localhost:5432/painel
        run: python tools/ci_postgres_smoke.py

  backend-test:
    # Stack novo (NestJS/TypeORM) — cobertura separada do painel Flask legado acima.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Instalar dependências
        run: npm ci
      - name: Testes (Jest)
        run: npm test -- --ci

  frontend-test:
    # Stack novo (Angular) — Vitest via @angular/build:unit-test, roda em Node sem browser real.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependências
        run: npm ci
      - name: Testes (Vitest)
        run: npm test
